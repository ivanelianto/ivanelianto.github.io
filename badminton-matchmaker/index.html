<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Badminton Matchmaker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="mobile-header">
        <button
          type="button"
          id="menu-toggle"
          class="menu-toggle"
          aria-controls="navigation-drawer"
          aria-expanded="false"
          aria-label="Open navigation menu"
        >
          ☰
        </button>

        <h1>Badminton Matchmaker</h1>
      </header>

      <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>

      <aside
        id="navigation-drawer"
        class="navigation-drawer"
        aria-label="Main navigation"
      >
        <div class="drawer-profile">
          <div class="drawer-avatar" aria-hidden="true">B</div>

          <div class="drawer-profile-copy">
            <strong>Badminton Matchmaker</strong>
          </div>

          <span class="drawer-arrow" aria-hidden="true">▼</span>
        </div>

        <nav class="drawer-menu" aria-label="Main menu">
          <button class="tab drawer-menu-item" data-view="dashboard">
            <span class="menu-icon" aria-hidden="true">📊</span>
            <span>Dashboard</span>
          </button>
          <button class="tab drawer-menu-item" data-view="players">
            <span class="menu-icon" aria-hidden="true">👤</span>
            <span>Manage Players</span>
          </button>
          <button class="tab drawer-menu-item" data-view="schedule">
            <span class="menu-icon" aria-hidden="true">📅</span>
            <span>Manage Schedule</span>
          </button>
          <button class="tab drawer-menu-item" data-view="manage-match">
            <span class="menu-icon" aria-hidden="true">🏸</span>
            <span>Manage Match</span>
          </button>
          <button class="tab drawer-menu-item" data-view="payments">
            <span class="menu-icon" aria-hidden="true">💰</span>
            <span>Manage Payments</span>
          </button>
          <button class="tab drawer-menu-item" data-view="io">
            <span class="menu-icon" aria-hidden="true">📁</span>
            <span>Import / Export</span>
          </button>
        </nav>
      </aside>

      <main class="content">
        <section id="view-dashboard" class="view" aria-live="polite"></section>
        <section id="view-players" class="view" aria-live="polite"></section>
        <section id="view-schedule" class="view" aria-live="polite"></section>
        <section id="view-manage-match" class="view" aria-live="polite"></section>
        <section id="view-payments" class="view" aria-live="polite"></section>
        <section id="view-io" class="view" aria-live="polite"></section>
      </main>

      <footer class="footer">
        <span>Powered by Pominton</span>
      </footer>
    </div>

    <dialog id="modal" class="modal" aria-modal="true"></dialog>

    <script type="module" src="app.js"></script>
  </body>
</html>
