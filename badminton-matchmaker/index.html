<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Badminton Matchmaker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div>
          <h1 class="brand">Badminton Matchmaker</h1>
          <p class="subtitle">Simple file-based scheduling & payments</p>
        </div>

        <div class="nav-drawer">
          <button
            type="button"
            class="drawer-toggle"
            aria-controls="main-drawer"
            aria-expanded="false"
            aria-label="Open navigation menu"
            id="drawer-toggle"
          >
            ☰
          </button>

          <div class="drawer-overlay" id="drawer-overlay" hidden></div>

          <nav
            id="main-drawer"
            class="drawer"
            aria-label="Main navigation"
            role="navigation"
          >
            <div class="drawer-header">
              <strong>Menu</strong>
              <button
                type="button"
                class="drawer-close"
                aria-label="Close navigation menu"
                id="drawer-close"
              >
                ✕
              </button>
            </div>

            <div class="drawer-body">
              <button class="tab" data-view="dashboard">Dashboard</button>
              <button class="tab" data-view="players">Manage Players</button>
              <button class="tab" data-view="schedule">Manage Schedule</button>
              <button class="tab" data-view="manage-match">Manage Match</button>
              <button class="tab" data-view="payments">Manage Payments</button>
              <button class="tab" data-view="io">Import / Export</button>
            </div>
          </nav>
        </div>
      </header>

      <main class="content">
        <section id="view-dashboard" class="view" aria-live="polite"></section>
        <section id="view-players" class="view" aria-live="polite"></section>
        <section id="view-schedule" class="view" aria-live="polite"></section>
        <section id="view-manage-match" class="view" aria-live="polite"></section>
        <section id="view-payments" class="view" aria-live="polite"></section>
        <section id="view-io" class="view" aria-live="polite"></section>
      </main>

      <footer class="footer">
        <span>Powered by Pominton</span>
      </footer>
    </div>

    <dialog id="modal" class="modal" aria-modal="true"></dialog>

    <script type="module" src="app.js"></script>
  </body>
</html>
